<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <pattern id="guilloche" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q5,0 10,10 T20,10" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#FFFAF0"/>
  <rect x="10" y="10" width="380" height="280" fill="url(#guilloche)"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#FFD700" stroke-width="2"/>
  <text x="200" y="50" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#8B4513">GOLD FOIL TEMPLATE</text>
  <rect x="180" y="70" width="40" height="40" fill="url(#goldGradient)" rx="5"/>
  <text x="200" y="95" text-anchor="middle" font-family="serif" font-size="20" fill="#FFF">🏆</text>
  <text x="200" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#333">Certificate of Achievement</text>
  <text x="200" y="170" text-anchor="middle" font-family="serif" font-size="10" fill="#666">This certifies that</text>
  <text x="200" y="200" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#000">[Student Name]</text>
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="10" fill="#666">has successfully completed</text>
  <text x="200" y="260" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#8B4513">[Course Name]</text>
</svg>