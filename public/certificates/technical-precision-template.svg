<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#FFFFFF"/>
  <rect x="10" y="10" width="380" height="280" fill="url(#grid)"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="200" y="50" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#059669">TECHNICAL PRECISION</text>
  <rect x="185" y="70" width="30" height="30" fill="#059669"/>
  <text x="200" y="90" text-anchor="middle" font-family="monospace" font-size="16" fill="#FFF">⚙</text>
  <text x="200" y="130" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151">CERTIFICATE</text>
  <text x="200" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#6B7280">AWARDED TO:</text>
  <text x="200" y="190" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#000">[Student Name]</text>
  <text x="200" y="220" text-anchor="middle" font-family="monospace" font-size="10" fill="#6B7280">FOR COMPLETION OF:</text>
  <text x="200" y="250" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#059669">[Course Name]</text>
  <text x="200" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#9CA3AF">ID: [CERTIFICATE-ID]</text>
</svg>